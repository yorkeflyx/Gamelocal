
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAMELOCAL | Play Games</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080d18;color:#fff;font-family:Arial,sans-serif}
header{background:#101b30;padding:22px}
header a{color:#66aaff;text-decoration:none}
h1{margin:20px 0 5px}
main{padding:20px;max-width:1100px;margin:auto}
input{width:100%;padding:15px;border-radius:12px;border:1px solid #293c5c;background:#111d31;color:white;font-size:16px}
.categories{display:flex;gap:10px;overflow-x:auto;margin:20px 0}
button{padding:11px 17px;border:0;border-radius:20px;background:#172943;color:white;white-space:nowrap}
button.active{background:#287cff}
#games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.game{background:#111d31;border:1px solid #243957;padding:17px;border-radius:14px}
.game h3{margin:0 0 10px;font-size:16px}
.game p{font-size:12px;color:#9baec8}
.game a{display:block;text-align:center;background:#287cff;color:white;padding:11px;border-radius:9px;text-decoration:none;font-size:13px}
#empty{text-align:center;color:#9baec8}
@media(min-width:700px){#games{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<header>
<a href="index.html">← HOME</a>
<h1>PLAY GAMES</h1>
<p>Explore free Android games</p>
</header>

<main>
<input id="search" type="search" placeholder="Search games...">

<div class="categories">
<button class="active" data-category="All">All</button>
<button data-category="Action">Action</button>
<button data-category="Adventure">Adventure</button>
<button data-category="Racing">Racing</button>
<button data-category="Sports">Sports</button>
<button data-category="Anime">Anime</button>
</div>

<div id="games"></div>
<p id="empty" hidden>No games found.</p>
</main>

<script>
const games=[
{name:"Roblox",category:"Adventure",id:"com.roblox.client"},
{name:"Brawl Stars",category:"Action",id:"com.supercell.brawlstars"},
{name:"Free Fire",category:"Action",id:"com.dts.freefireth"},
{name:"Subway Surfers",category:"Adventure",id:"com.kiloo.subwaysurf"},
{name:"Asphalt Legends",category:"Racing",id:"com.gameloft.android.ANMP.GloftA9HM"},
{name:"eFootball",category:"Sports",id:"jp.konami.pesam"},
{name:"Mobile Legends",category:"Action",id:"com.mobile.legends"},
{name:"Pokémon GO",category:"Adventure",id:"com.nianticlabs.pokemongo"},
{name:"Shadow Fight 4",category:"Action",id:"com.nekki.shadowfightarena"},
{name:"Dragon Ball Legends",category:"Anime",id:"com.bandainamcoent.dblegends_ww"}
];

let selected="All";

function render(){
const query=document.getElementById("search").value.toLowerCase();
const filtered=games.filter(g=>
(selected==="All"||g.category===selected)&&
g.name.toLowerCase().includes(query)
);

document.getElementById("games").innerHTML=filtered.map(g=>`
<div class="game">
<h3>${g.name}</h3>
<p>${g.category} · Android</p>
<a href="https://play.google.com/store/apps/details?id=${g.id}" target="_blank">PLAY NOW</a>
</div>
`).join("");

document.getElementById("empty").hidden=filtered.length!==0;
}

document.getElementById("search").addEventListener("input",render);

document.querySelectorAll(".categories button").forEach(button=>{
button.addEventListener("click",()=>{
document.querySelector(".categories .active").classList.remove("active");
button.classList.add("active");
selected=button.dataset.category;
render();
});
});

render();
</script>
</body>
</html>
